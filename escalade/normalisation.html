<title>Normalisation des marchés</title>
<!--
  Widget Grist « Normalisation des marchés » — réservé aux acheteurs du pôle.
  - Rattache les fiches saisies librement par les services à un marché du référentiel (en lot),
    crée un marché normalisé à partir d'une saisie, entretient le référentiel et fusionne les doublons.
  - Écrit dans Fiches.Marche et dans la table Marches ; ne modifie jamais ce que le service a saisi
    (Marche_saisi, Marche_saisi_ref, Marche_saisi_titulaire).
  - Aucune donnée dans ce fichier. Niveau d'accès du widget : « Accès complet au document ».
-->

:root[data-theme="dark"]{

<div class="wrap">

<script>
/* --- commun.js (inclus) --- */
/* =====================================================================
 *  commun.js — utilitaires partagés par les widgets Grist
 *  « Signalements – marchés mutualisés » (pôle achats DPFAC – DIR-SG Grand Ouest)
 *
 *  Aucune donnée ici : uniquement du code. Les données vivent dans le document Grist.
 * ===================================================================== */
(function (global) {
  "use strict";

  /* ------------------------------------------------------------------ *
   *  Paramétrage technique                                              *
   * ------------------------------------------------------------------ */
  // Instances Grist essayées pour charger l'API des widgets, après l'origine de la page hôte.
  const ORIGINES_GRIST = ["https://grist.numerique.gouv.fr", "https://docs.getgrist.com"];
  const TABLES = { params: "Parametres", services: "Services", users: "Utilisateurs", marches: "Marches",
                   typos: "Typologies", fiches: "Fiches" };

  /* ------------------------------------------------------------------ *
   *  Utilitaires                                                        *
   * ------------------------------------------------------------------ */
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => [...(el || document).querySelectorAll(s)];
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // fetchTable renvoie des colonnes {id:[…], Col:[…]} → tableau d'objets
  const toRows = t => {
    if (!t || !t.id) return [];
    const keys = Object.keys(t).filter(k => !k.startsWith("gristHelper_"));
    return t.id.map((_, i) => { const o = {}; keys.forEach(k => o[k] = t[k][i]); return o; });
  };
  // Référence : nombre, ["R", id], ou texte (colonne mal typée)
  const refId = v => Array.isArray(v) ? v[1] : v;
  // Dates Grist : secondes depuis 1970 (UTC), ou chaîne ISO
  const toDate = v => {
    if (v == null || v === "" || v === 0) return null;
    const d = typeof v === "number" ? new Date(v * 1000) : new Date(v);
    return isNaN(d) ? null : d;
  };
  const fmtDate = v => { const d = toDate(v); return d ? d.toLocaleDateString("fr-FR", { timeZone: "UTC" }) : ""; };
  const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
  const isoToEpoch = iso => { const [y, m, d] = String(iso).split("-").map(Number); return Date.UTC(y, m - 1, d) / 1000; };
  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, r) => setTimeout(() => r(new Error("délai dépassé")), ms))]);
  // Texte sans accents, minuscules, ponctuation remplacée par des espaces
  const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
    .replace(/[^a-z0-9]+/g, " ").trim();
  const listVal = v => Array.isArray(v) ? v.filter((x, i) => !(i === 0 && x === "L")) : (v ? String(v).split(/\s*,\s*/) : []);
  // Jours ouvrés (lun.-ven.) après a jusqu'à b inclus, en UTC — même règle que les formules Grist
  function joursOuvres(a, b) {
    if (!a || !b) return null;
    let n = 0; const d = new Date(Date.UTC(a.getUTCFullYear(), a.getUTCMonth(), a.getUTCDate()));
    const e = Date.UTC(b.getUTCFullYear(), b.getUTCMonth(), b.getUTCDate());
    while (d.getTime() < e) { d.setUTCDate(d.getUTCDate() + 1); const w = d.getUTCDay(); if (w !== 0 && w !== 6) n++; }
    return n;
  }
  // Stockage local protégé (la page doit fonctionner sans)
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* idem */ } }
  };

  /* ------------------------------------------------------------------ *
   *  Connexion Grist                                                    *
   * ------------------------------------------------------------------ */
  function loadScript(src) {
    return new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = src; s.onload = res; s.onerror = () => rej(new Error("chargement impossible : " + src));
      document.head.appendChild(s);
    });
  }
  /** Renvoie "grist" ou lève une erreur { code: "horsgrist" | "api" | "acces" }. */
  async function connect() {
    if (window === window.parent) throw Object.assign(new Error("hors Grist"), { code: "horsgrist" });
    const origines = [];
    try { if (document.referrer) origines.push(new URL(document.referrer).origin); } catch (e) { /* referrer absent */ }
    ORIGINES_GRIST.forEach(o => { if (!origines.includes(o)) origines.push(o); });
    for (const o of origines) {
      try { await loadScript(o + "/grist-plugin-api.js"); if (window.grist) break; } catch (e) { /* origine suivante */ }
    }
    if (!window.grist) throw Object.assign(new Error("API Grist introuvable"), { code: "api" });
    grist.ready({ requiredAccess: "full" });
    try { await withTimeout(grist.docApi.listTables(), 5000); }
    catch (e) { throw Object.assign(new Error("accès refusé"), { code: "acces" }); }
    return "grist";
  }

  async function fetchRows(table) {
    try { return toRows(await grist.docApi.fetchTable(table)); } catch (e) { return null; }
  }

  /** Métadonnées : types, choix et options des colonnes, par table. */
  async function loadMeta() {
    const T = toRows(await grist.docApi.fetchTable("_grist_Tables"));
    const C = toRows(await grist.docApi.fetchTable("_grist_Tables_column"));
    const byId = {}; T.forEach(t => byId[t.id] = t.tableId);
    const meta = {};
    C.forEach(c => {
      const t = byId[c.parentId]; if (!t) return;
      let o = {}; try { o = c.widgetOptions ? JSON.parse(c.widgetOptions) : {}; } catch (e) { o = {}; }
      (meta[t] = meta[t] || {})[c.colId] = { type: c.type, choices: o.choices || [], options: o, label: c.label, ref: c.id };
    });
    return meta;
  }
  const colType = (meta, t, c) => meta && meta[t] && meta[t][c] ? meta[t][c].type : undefined;
  /** Choix d'une colonne Choice / ChoiceList, lus dans Grist. */
  const choices = (meta, t, c) => (meta && meta[t] && meta[t][c] && meta[t][c].choices) || [];

  /** Encode une valeur selon le type réel de la colonne (document éventuellement mal typé).
   *  Renvoie undefined si la colonne n'existe pas (on ne l'écrit pas), null si valeur vide. */
  function encode(meta, table, col, val, kind) {
    const known = meta && meta[table];
    const t = colType(meta, table, col);
    if (known && t === undefined) return undefined;
    if (val === "" || val == null || (Array.isArray(val) && !val.length)) return null;
    switch (kind) {
      case "ref": return t && t.startsWith("Ref:") ? val.id : val.label;
      case "date": return (!t || t === "Date" || t.startsWith("DateTime")) ? isoToEpoch(val) : val;
      case "list": return (!t || t === "ChoiceList") ? ["L"].concat(val) : val.join(", ");
      case "num": {
        const n = Number(String(val).replace(/\s/g, "").replace(",", ".")); if (isNaN(n)) return null;
        return (t === "Text" || t === "Any") ? String(n) : n;
      }
      case "bool": return (t === "Text") ? (val ? "Oui" : "Non") : !!val;
      default: return val;
    }
  }

  /** Paramètres (table Parametres : Cle → Valeur). */
  async function loadParams() {
    const rows = await fetchRows(TABLES.params) || [];
    const p = {}; rows.forEach(r => { if (r.Cle) p[String(r.Cle).trim()] = r.Valeur == null ? "" : String(r.Valeur).trim(); });
    return p;
  }

  /** Nom du siège d'un service (Siege vide → le service est lui-même un siège). */
  function siegeOf(services) {
    const byId = new Map(services.map(s => [s.id, s]));
    return s => {
      if (!s) return "Non rattaché";
      const v = refId(s.Siege);
      if (v == null || v === "" || v === 0) return s.Nom;
      if (typeof v === "number") { const h = byId.get(v); return h ? h.Nom : s.Nom; }
      return String(v);
    };
  }

  /** Écran bloquant (pas de repli sur des données codées : tout vient de Grist). */
  function fatal(el, titre, html) {
    el.innerHTML = `<div class="fatal" role="alert"><div class="fatal-ico" aria-hidden="true">!</div>
      <h2>${esc(titre)}</h2><div>${html}</div></div>`;
  }
  function messageConnexion(err) {
    if (err && err.code === "horsgrist") return ["Ouvrez ce widget dans Grist",
      "Cette page est un widget personnalisé : elle s'affiche dans le document Grist du pôle achats (<b>grist.numerique.gouv.fr</b>). Elle ne contient aucune donnée par elle-même."];
    if (err && err.code === "acces") return ["Accès au document à autoriser",
      "Le widget n'a pas accès au document. Dans le panneau de droite du widget, réglez le niveau d'accès sur <b>Accès complet au document</b>."];
    return ["Connexion à Grist impossible", "L'API des widgets Grist n'a pas pu être chargée. Rechargez la page ; si le problème persiste, contactez le pôle achats."];
  }

  global.SIG = { TABLES, $, $$, esc, toRows, refId, toDate, fmtDate, todayISO, isoToEpoch, withTimeout, norm, listVal,
    joursOuvres, store, connect, fetchRows, loadMeta, colType, choices, encode, loadParams, siegeOf, fatal, messageConnexion };
})(window);

</script>
<script>
(function(){
"use strict";
const { $, $$, esc, refId, fmtDate, norm, connect, fetchRows, loadMeta, choices, loadParams, fatal, messageConnexion, TABLES } = SIG;

/* ------------------------------------------------------------------ *
 *  Paramétrage                                                        *
 * ------------------------------------------------------------------ */
const MOTS_VIDES = new Set(["de", "des", "du", "la", "le", "les", "et", "a", "au", "aux", "d", "l", "en", "pour", "sur", "marche", "marches"]);
const SEUIL_PROBABLE = 0.55, SEUIL_DOUBLON = 0.6;

/* ------------------------------------------------------------------ *
 *  État                                                               *
 * ------------------------------------------------------------------ */
let META = null, FICHES = [], MARCHES = [], SERVICES = new Map(), TAB = "rattacher";
let OPEN = new Set();   // groupes dont le formulaire de création est ouvert

/* ------------------------------------------------------------------ *
 *  Similarité saisie ↔ marché                                         *
 * ------------------------------------------------------------------ */
const mots = s => norm(s).split(" ").filter(w => w && !MOTS_VIDES.has(w));
const compact = s => norm(s).replace(/ /g, "");
const motProche = (a, b) => a === b || (a.length >= 4 && b.length >= 4 && (a.startsWith(b) || b.startsWith(a)));
function score(saisie, m) {
  const alias = String(m.Alias || "").split(/\r?\n/).map(norm).filter(Boolean);
  if (saisie.objet && alias.includes(norm(saisie.objet))) return 1;
  let s = 0;
  const r1 = compact(saisie.ref), r2 = compact(m.Reference);
  if (r1 && r2 && (r1 === r2 || (r1.length >= 5 && (r2.includes(r1) || r1.includes(r2))))) s += 0.6;
  const t1 = norm(saisie.tit), t2 = norm(m.Titulaire);
  if (t1 && t2 && (t1 === t2 || t1.includes(t2) || t2.includes(t1))) s += 0.35;
  const ws = mots(saisie.objet), wm = mots([m.Intitule, m.Segment, m.Alias].join(" "));
  if (ws.length) s += 0.65 * ws.filter(w => wm.some(x => motProche(w, x))).length / ws.length;
  return Math.min(1, s);
}
function suggestions(saisie, n) {
  return MARCHES.filter(m => m.Actif !== false && !refId(m.Fusionne_dans))
    .map(m => ({ m, s: score(saisie, m) })).filter(x => x.s >= 0.2).sort((a, b) => b.s - a.s).slice(0, n || 3);
}

/* ------------------------------------------------------------------ *
 *  Données                                                            *
 * ------------------------------------------------------------------ */
async function load() {
  META = await loadMeta();
  if (!META[TABLES.fiches] || !META[TABLES.marches]) throw Object.assign(new Error(), { install: true });
  const [fi, ma, sv] = await Promise.all([fetchRows(TABLES.fiches), fetchRows(TABLES.marches), fetchRows(TABLES.services)]);
  FICHES = fi || []; MARCHES = ma || []; SERVICES = new Map((sv || []).map(s => [s.id, s]));
}
const aNormaliser = () => FICHES.filter(f => !refId(f.Marche) && f.Statut !== "Annulé");
/** Regroupe les fiches non rattachées par saisie (texte normalisé + référence). */
function groupes() {
  const g = new Map();
  aNormaliser().forEach(f => {
    const objet = String(f.Marche_saisi || "").trim(), ref = String(f.Marche_saisi_ref || "").trim(), tit = String(f.Marche_saisi_titulaire || "").trim();
    const key = mots(objet).join(" ") || norm(objet);   // « Entretien des espaces verts » = « entretien espaces verts »
    if (!g.has(key)) g.set(key, { key, objet: objet || "(marché non précisé)", ref, tit, fiches: [] });
    const x = g.get(key); x.fiches.push(f); if (!x.tit && tit) x.tit = tit; if (!x.ref && ref) x.ref = ref;
  });
  return [...g.values()].sort((a, b) => b.fiches.length - a.fiches.length || a.objet.localeCompare(b.objet, "fr"));
}
/** Paires de marchés actifs probablement identiques. */
function doublons() {
  const act = MARCHES.filter(m => m.Actif !== false && !refId(m.Fusionne_dans) && m.Intitule), out = [];
  for (let i = 0; i < act.length; i++) for (let j = i + 1; j < act.length; j++) {
    const a = act[i], b = act[j];
    const s = Math.max(score({ objet: a.Intitule, ref: a.Reference, tit: a.Titulaire }, b), score({ objet: b.Intitule, ref: b.Reference, tit: b.Titulaire }, a));
    if (s >= SEUIL_DOUBLON) out.push({ a, b, s });
  }
  return out.sort((x, y) => y.s - x.s);
}
const nbFiches = id => FICHES.filter(f => refId(f.Marche) === id).length;
const mLabel = m => m.Intitule + (m.Reference ? " – " + m.Reference : "");

/* ------------------------------------------------------------------ *
 *  Écriture dans Grist                                                *
 * ------------------------------------------------------------------ */
async function act(actions, msg) {
  try { await grist.docApi.applyUserActions(actions); toast(msg); await reload(); }
  catch (e) {
    const t = String(e && e.message || e);
    banner("err", /access|acc[eè]s|permission|denied|blocked/i.test(t)
      ? "Action refusée par les règles d'accès : seuls les acheteurs (table Utilisateurs, rôle Acheteur) peuvent normaliser."
      : "L'action a échoué : " + esc(t));
  }
}
const aliasAvec = (m, ajouts) => {
  const ex = String(m.Alias || "").split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  const vus = new Set(ex.map(norm).concat([norm(m.Intitule)]));
  ajouts.map(s => String(s || "").trim()).filter(Boolean).forEach(s => { if (!vus.has(norm(s))) { ex.push(s); vus.add(norm(s)); } });
  return ex.join("\n");
};
async function rattacher(ids, marcheId, saisie, garderAlias) {
  const m = MARCHES.find(x => x.id === marcheId); if (!m || !ids.length) return;
  const acts = [["BulkUpdateRecord", TABLES.fiches, ids, { Marche: ids.map(() => marcheId) }]];
  if (garderAlias && saisie && saisie.objet && score({ objet: saisie.objet }, m) < 1 && norm(saisie.objet) !== norm(m.Intitule))
    acts.push(["UpdateRecord", TABLES.marches, marcheId, { Alias: aliasAvec(m, [saisie.objet]) }]);
  await act(acts, `${ids.length} fiche${ids.length > 1 ? "s" : ""} rattachée${ids.length > 1 ? "s" : ""} à « ${m.Intitule} »`);
}
async function creerEtRattacher(ids, champs, saisie) {
  try {
    const rec = { ...champs, Actif: true };
    if (saisie.objet && norm(saisie.objet) !== norm(champs.Intitule)) rec.Alias = saisie.objet;
    Object.keys(rec).forEach(k => { if (rec[k] === "" || rec[k] == null || (META.Marches && !META.Marches[k])) delete rec[k]; });
    const r = await grist.docApi.applyUserActions([["AddRecord", TABLES.marches, null, rec]]);
    const id = r.retValues[0];
    if (ids.length) await grist.docApi.applyUserActions([["BulkUpdateRecord", TABLES.fiches, ids, { Marche: ids.map(() => id) }]]);
    toast(`Marché « ${champs.Intitule} » créé · ${ids.length} fiche${ids.length > 1 ? "s" : ""} rattachée${ids.length > 1 ? "s" : ""}`);
    await reload();
  } catch (e) { banner("err", "Création impossible : " + esc(e && e.message || e)); }
}
/** Fusion : B est absorbé par A (fiches re-pointées, libellés de B en alias de A, B désactivé). */
async function fusionner(aId, bId) {
  const a = MARCHES.find(x => x.id === aId), b = MARCHES.find(x => x.id === bId); if (!a || !b || a.id === b.id) return;
  const fichesB = FICHES.filter(f => refId(f.Marche) === b.id).map(f => f.id);
  const enfants = MARCHES.filter(m => refId(m.Fusionne_dans) === b.id).map(m => m.id);
  if (!confirm(`Fusionner « ${mLabel(b)} » dans « ${mLabel(a)} » ?\n\n· ${fichesB.length} fiche(s) re-pointée(s) vers le marché conservé\n· libellés du doublon ajoutés aux alias\n· doublon désactivé (non supprimé)\n\nAnnulable avec Ctrl+Z dans Grist.`)) return;
  const majA = { Alias: aliasAvec(a, [b.Intitule, b.Reference && (b.Intitule + " – " + b.Reference)].concat(String(b.Alias || "").split(/\r?\n/))) };
  ["Reference", "Titulaire", "Support", "Segment", "Montant_commande_12m"].forEach(k => { if (!a[k] && b[k] && META.Marches[k]) majA[k] = b[k]; });
  const acts = [["UpdateRecord", TABLES.marches, a.id, majA], ["UpdateRecord", TABLES.marches, b.id, { Actif: false, Fusionne_dans: a.id }]];
  if (fichesB.length) acts.unshift(["BulkUpdateRecord", TABLES.fiches, fichesB, { Marche: fichesB.map(() => a.id) }]);
  if (enfants.length) acts.push(["BulkUpdateRecord", TABLES.marches, enfants, { Fusionne_dans: enfants.map(() => a.id) }]);
  await act(acts, `Fusion faite : ${fichesB.length} fiche(s) re-pointée(s) vers « ${a.Intitule} »`);
}

function renderKpis(G, D) {
  const n = aNormaliser().length, actifs = MARCHES.filter(m => m.Actif !== false && !refId(m.Fusionne_dans)).length;

function bindGroups(list) {

      const id = EDIT; EDIT = null;
      await act([id === "new" ? ["AddRecord", TABLES.marches, null, rec] : ["UpdateRecord", TABLES.marches, id, rec]],
        id === "new" ? `Marché « ${rec.Intitule} » créé` : `Marché « ${rec.Intitule} » enregistré`);
    };
  }
}

/* ------------------------------------------------------------------ *
 *  Divers                                                             *
 * ------------------------------------------------------------------ */
let tT; function toast(msg) { if (!msg) return; const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(tT); tT = setTimeout(() => t.classList.remove("on"), 2800); banner("", ""); }
function banner(kind, html) { $("#banner").innerHTML = html ? `<div class="banner ${kind}">${html}</div>` : ""; }
async function reload() { await load(); render(); }

/* ------------------------------------------------------------------ *
 *  Démarrage                                                          *
 * ------------------------------------------------------------------ */
(async function start() {
  try { await connect(); }
  catch (e) { const [t, h] = messageConnexion(e); fatal($("#app"), t, h); return; }
  try {
    await load();
    const P = await loadParams(); if (P.libelle_pole) $("#sub").textContent = P.libelle_pole + " · rattacher les saisies au référentiel, fusionner les doublons";
  } catch (e) {
    fatal($("#app"), e.install ? "Document à installer" : "Lecture du document impossible",
      e.install ? "Tables Fiches et Marches absentes : lancez la page <b>Installation</b>." : esc(e && e.message || e));
    return;
  }
  $("#refresh").onclick = reload;
  render();
})();
})();
</script>
