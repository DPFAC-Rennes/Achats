<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogue des marchés</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --ink:#161a21; --muted:#4f5868; --line:#d9dde3; --soft:#eef0f4;
  --accent:#1f3d7a; --accent-bg:#e5ebf7; --focus:#1f5bd6;
  --ok:#17663b; --ok-bg:#e1f2e8; --warn:#8a4b00; --warn-bg:#fcecd2;
  --bad:#a1170f; --bad-bg:#fbe3e1; --na:#4f5868; --na-bg:#e9ebef; --hl:#ffe680;
  --mut:#5a3d8a; --mut-bg:#ece5f7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171c; --panel:#1c2027; --ink:#eceff4; --muted:#a8b0bd; --line:#323843; --soft:#262b34;
    --accent:#9ab8f2; --accent-bg:#22314d; --focus:#8fb4ff;
    --ok:#7ddba5; --ok-bg:#173a27; --warn:#f5c063; --warn-bg:#3f2d0f;
    --bad:#ff9a90; --bad-bg:#46211e; --na:#a8b0bd; --na-bg:#2b3039; --hl:#6b5a00;
    --mut:#c9b3f0; --mut-bg:#33284a; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#14171c; --panel:#1c2027; --ink:#eceff4; --muted:#a8b0bd; --line:#323843; --soft:#262b34;
  --accent:#9ab8f2; --accent-bg:#22314d; --focus:#8fb4ff;
  --ok:#7ddba5; --ok-bg:#173a27; --warn:#f5c063; --warn-bg:#3f2d0f;
  --bad:#ff9a90; --bad-bg:#46211e; --na:#a8b0bd; --na-bg:#2b3039; --hl:#6b5a00;
  --mut:#c9b3f0; --mut-bg:#33284a; --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Marianne,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- En-tête compact ---------- */
.brand{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand h1{margin:0;font-size:16px;line-height:1.2}
.brand .titre p{margin:1px 0 0;font-size:12px;color:var(--muted)}
.sign{display:flex;align-items:center;gap:12px;margin:0;flex:none}
.sign img{height:40px;width:auto;display:block}
.sign .vl{width:3px;align-self:stretch;min-height:34px;background:#E1772E;flex:none}
.sign figcaption{font-size:12px;line-height:1.35;color:var(--ink);max-width:170px}
.sign:not(.has-logo) .vl{display:none}
.droite{display:flex;align-items:center;gap:10px}
.dl{width:30px;height:30px;border:1px solid transparent;background:none;border-radius:7px;color:var(--muted);cursor:pointer;display:grid;place-items:center;flex:none}
.dl:hover{border-color:var(--line);color:var(--accent);background:var(--soft)}
.info{margin:0;padding:6px 16px;font-size:12.5px;color:var(--accent);background:var(--accent-bg)}
.info a{color:inherit;font-weight:600}
.diag{margin:0;padding:6px 16px;font-size:12.5px;color:var(--warn);background:var(--warn-bg)}
.version{font-size:11px;color:var(--muted);text-align:right;padding:0 16px 14px}
.top{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:7px 16px 0}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-bottom:7px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:2px;gap:2px}
.seg button{border:0;background:none;border-radius:7px;padding:5px 11px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.bar .search{flex:1 1 160px;position:relative;min-width:150px}
.bar .search input{width:100%;height:34px;padding:0 10px 0 32px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-size:14px}
.bar .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.bar select{height:34px;padding:0 6px;border:1px solid var(--line);border-radius:9px;background:var(--panel);width:185px;font-size:13px;text-overflow:ellipsis}
.chipsbar{display:flex;align-items:flex-start;gap:6px;padding:0 0 7px}
.chipsbar .chips{flex:1;margin:0;max-height:none;overflow:visible}
.chipsbar.ferme .chips{max-height:28px;overflow:hidden}
.chips .chip{height:28px;padding:2px 10px 2px 3px}
.more{flex:none;height:28px;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:0 10px 0 8px;cursor:pointer;font-size:12.5px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;color:var(--accent);font-weight:600}
.more svg{transition:transform .15s}
.more[aria-expanded="true"] svg{transform:rotate(180deg)}
.sumline{display:flex;align-items:center;gap:8px;padding:5px 0 7px;border-top:1px solid var(--line);flex-wrap:wrap}
.sortlbl{margin-left:auto;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sortlbl select{height:28px;border:1px solid var(--line);border-radius:7px;background:var(--panel);font-size:12.5px;padding:0 6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{flex:1 1 320px;position:relative}
.search input{width:100%;padding:10px 12px 10px 38px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:15px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
select{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);max-width:280px}
.kpis{display:flex;gap:2px;flex-wrap:wrap;align-items:center}
.kpi{border:1px solid transparent;background:none;border-radius:7px;padding:2px 8px;cursor:pointer;display:flex;gap:5px;align-items:baseline}
.kpi:hover{background:var(--soft)}
.kpi b{font-size:14px;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:12.5px}
.kpi[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.kpi.ok b{color:var(--ok)} .kpi.warn b{color:var(--warn)} .kpi.bad b{color:var(--bad)} .kpi.mut b{color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 11px 3px 4px;cursor:pointer;display:flex;align-items:center;gap:7px;font-size:13px}
.code{min-width:26px;height:22px;border-radius:999px;display:inline-grid;place-items:center;font-weight:700;font-size:11.5px;color:#fff;padding:0 4px}
.chip small{color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--soft);border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.reset{border:0;background:none;color:var(--accent);text-decoration:underline;cursor:pointer;font-size:13px;padding:3px 6px}

/* ---------- Liste ---------- */
main{padding:6px 16px 48px}
.empty{color:var(--muted);padding:40px 0;text-align:center}
.hors-grist{max-width:560px;margin:60px auto;text-align:center;color:var(--muted)}
.hors-grist strong{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
details.dom{margin:14px 0 0}
details.dom>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 4px;border-radius:10px}
details.dom>summary::-webkit-details-marker{display:none}
details.dom>summary .chev{transition:transform .15s;color:var(--muted);flex:none}
details.dom[open]>summary .chev{transform:rotate(90deg)}
details.dom>summary h2{margin:0;font-size:15px}
details.dom>summary .code{min-width:34px;height:26px;border-radius:7px;font-size:13px}
details.dom>summary .count{margin-left:auto;color:var(--muted);font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px;padding:4px 0 6px}
.card{border:1px solid var(--line);border-left:5px solid var(--c,#888);border-radius:10px;padding:11px 13px 10px;background:var(--panel);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%;box-shadow:var(--shadow)}
.card:hover{border-color:var(--accent);border-left-color:var(--c,#888)}
.kick{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;line-height:1.3}
.card .t{font-weight:700;line-height:1.3;font-size:14.5px}
.card .who{display:flex;gap:6px;align-items:center;font-weight:600}
.card .who svg,.card .sites svg{color:var(--muted);flex:none}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:2px 0 0;font-size:12.5px}
.card dt{color:var(--muted)} .card dd{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sites{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.etab{font-size:12px;padding:1px 7px;border-radius:6px;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.foot{display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap;margin-top:2px;font-size:12.5px;color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px}
.badge{border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.b-ok{color:var(--ok);background:var(--ok-bg)} .b-warn{color:var(--warn);background:var(--warn-bg)}
.b-bad{color:var(--bad);background:var(--bad-bg)} .b-na{color:var(--na);background:var(--na-bg)}
.b-prog{color:var(--accent);background:var(--accent-bg)} .b-mut{color:var(--mut);background:var(--mut-bg)}
.note{font-size:12px;color:var(--muted)}
mark{background:var(--hl);color:inherit;border-radius:2px}

/* ---------- Fiche (dialogue) ---------- */
.veil{position:fixed;inset:0;background:rgba(10,14,20,.4);opacity:0;pointer-events:none;transition:opacity .15s;z-index:9}
.veil.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(780px,100%);background:var(--panel);z-index:10;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column;border-left:1px solid var(--line);visibility:hidden}
.panel.on{transform:none;visibility:visible}
.panel header{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.panel header .h{flex:1;min-width:0}
.panel header .badges{display:flex;gap:6px;flex-wrap:wrap}
.crumb{font-size:12px;color:var(--muted);line-height:1.4}
.panel h2{margin:4px 0 6px;font-size:19px;line-height:1.3}
.tools{display:flex;gap:6px;flex:none}
.btn{border:1px solid var(--line);background:var(--soft);border-radius:8px;height:34px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.icon{width:34px;padding:0;justify-content:center}
.panel .body{overflow:auto;padding:6px 18px 30px}
.panel h3{margin:20px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.fields{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.field{display:grid;grid-template-columns:170px 1fr 34px;gap:10px;align-items:center;padding:6px 6px 6px 12px;border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.field dt{color:var(--muted);font-size:13px}
.field dd{margin:0;word-break:break-word}
.cp{width:30px;height:30px;border:1px solid transparent;background:none;border-radius:7px;cursor:pointer;display:grid;place-items:center;color:var(--muted);flex:none}
.cp:hover{background:var(--soft);border-color:var(--line);color:var(--ink)}
.cp.done{color:var(--ok)}
.ej{border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
.ej-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 10px 9px 12px;background:var(--soft)}
.ej-head .num{font-family:ui-monospace,Consolas,monospace;font-weight:700;font-size:14px}
.ej-head .sp{flex:1}
.tbl-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
thead th{color:var(--muted);font-weight:600;font-size:12px;background:var(--panel)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
td.act{width:34px;padding:2px 4px}
td small{color:var(--muted)}
.hors{padding:6px 12px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line)}
/* ---------- Onglets et contrôles ---------- */
.tabs{display:flex;gap:2px;margin:0 4px}
.tab{border:0;background:none;padding:6px 10px;border-bottom:3px solid transparent;cursor:pointer;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center;font-size:13.5px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-size:12px;padding:0 7px;border-radius:999px;background:var(--bad-bg);color:var(--bad)}
.tab .n.zero{background:var(--ok-bg);color:var(--ok)}
#ctrl{padding:6px 16px 48px}
.ctrl-intro{color:var(--muted);font-size:13px;margin:10px 0}
.cgroup{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:12px 0;box-shadow:var(--shadow);overflow:hidden}
.cgroup>h2{margin:0;font-size:14px;padding:10px 14px;display:flex;gap:8px;align-items:center;background:var(--soft)}
.cgroup>h2 .note{font-weight:400;margin-left:auto}
.crow{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:8px 16px;padding:10px 14px;border-top:1px solid var(--line);align-items:center}
.crow .what b{display:block;line-height:1.3}
.crow .what .note{display:block}
.src{display:inline-flex;gap:5px;align-items:center;font-size:12px;padding:1px 8px;border-radius:6px;background:var(--accent-bg);color:var(--accent);margin:3px 4px 0 0;font-weight:600}
.fix{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.fix input,.fix select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);min-width:0;width:200px;max-width:100%}
.fix .btn{height:32px}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.ghost{background:none}
.msg{font-size:12.5px;flex-basis:100%;text-align:right}
.msg.ok{color:var(--ok)} .msg.err{color:var(--bad)}
@media (max-width:760px){ .crow{grid-template-columns:1fr} .fix{justify-content:flex-start} }
@media (max-width:620px){ .sign figcaption{display:none} .sign img{height:32px} .field{grid-template-columns:1fr 34px} .field dt{grid-column:1/-1} .cards{grid-template-columns:1fr} .tools .lbl{display:none} }
</style>
</head>
<body>
<header class="brand">
  <div class="titre"><h1>Catalogue des marchés</h1><p>Classement selon la nomenclature GM DAE</p></div>
  <div class="droite">
  <button type="button" class="dl" id="dl" hidden title="Télécharger le catalogue autonome (fichier HTML consultable hors ligne)" aria-label="Télécharger le catalogue autonome">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
  </button>
  <figure class="sign" id="sign">
    <img id="logo" alt="Ministère de la Justice – Secrétariat général" hidden>
    <span class="vl" aria-hidden="true"></span>
    <figcaption id="mention"></figcaption>
  </figure>
  </div>
</header>
<p id="diag" class="diag" role="status" hidden></p>
<p id="info" class="info" role="status" hidden></p>
<div class="top">
  <div id="ui">
    <div class="bar">
      <div class="seg" id="profil" role="group" aria-label="Je suis gestionnaire">
        <button type="button" data-p="PJJ" aria-pressed="false" title="Gestionnaire PJJ, programme 182">PJJ · 182</button>
        <button type="button" data-p="DISP" aria-pressed="false" title="Gestionnaire DISP, programmes 107 et 912">DISP · 107 + 912</button>
      </div>
      <div class="seg" id="sous" role="group" aria-label="Programme DISP" hidden>
        <button type="button" data-s="" aria-pressed="true">Tout</button>
        <button type="button" data-s="107" aria-pressed="false" title="Services de l'État">107</button>
        <button type="button" data-s="912" aria-pressed="false" title="Cantine (compte de commerce)">912 cantine</button>
      </div>
      <div class="tabs" role="tablist" aria-label="Affichage">
        <button type="button" role="tab" class="tab" id="tab-cat" data-tab="cat" aria-controls="list" aria-selected="true">Catalogue</button>
        <button type="button" role="tab" class="tab" id="tab-ctrl" data-tab="ctrl" aria-controls="ctrl" aria-selected="false" tabindex="-1">Contrôles <span class="n" id="nctrl">0</span></button>
      </div>
      <div class="search need-prof" role="search">
        <label for="q" class="sr">Rechercher un marché</label>
        <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Titulaire, n° EJ, GM, objet, établissement…" autocomplete="off">
      </div>
      <label for="etab" class="sr">Établissement ou service</label>
      <select id="etab" class="need-prof cat-only"><option value="">Tous les établissements</option></select>
    </div>
    <div class="sumline need-prof cat-only">
      <div class="kpis" id="kpis" role="group" aria-label="Filtrer par échéance"></div>
      <label for="sort" class="sortlbl">Trier
        <select id="sort">
          <option value="arbo">par domaine</option>
          <option value="fin">par date de fin</option>
          <option value="titulaire">par titulaire</option>
        </select></label>
    </div>
    <div class="chipsbar need-prof cat-only">
      <div class="chips" id="chips" role="group" aria-label="Filtrer par domaine d'achat"></div>
      <button type="button" class="more" id="more" aria-expanded="false" aria-controls="chips" hidden></button>
    </div>
  </div>
</div>
<p id="live" class="sr" aria-live="polite"></p>
<main id="list" role="tabpanel" aria-labelledby="tab-cat"></main>
<section id="ctrl" role="tabpanel" aria-labelledby="tab-ctrl" hidden></section>
<datalist id="gmlist"></datalist>
<p class="version" id="version"></p>

<div class="veil" id="veil"></div>
<div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="ptitle">
  <header>
    <div class="h" id="ph"></div>
    <div class="tools">
      <button class="btn" id="copyAll" type="button"></button>
      <button class="btn icon" id="close" type="button" aria-label="Fermer la fiche"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
  </header>
  <div class="body" id="pb"></div>
</div>

<script>
/* ===================== Configuration ===================== */
const SOURCE0 = '<!doctype html>\n' + document.documentElement.outerHTML;   // copie de secours de la page
const VERSION = '2026-10-23 · v14';
const NOM_AUTONOME = 'Catalogue-marché-autonome.html';
let RAW = [], LOGO_DATA = null, FONTS_DATA = [];
const b64 = buf => { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const deB64 = t => { const s = atob(t), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u.buffer; };
const ALERTE_JOURS = 183;
const MENTION = 'Conçu et réalisé par le DPFAC de Rennes';
const RESSOURCES = { table:'Contexte', logo:'Logo_SG', police:'Police_Marianne', mention:'Mention' };
const PROFILS = { PJJ:['182'], DISP:['107','912'] };
const LIB_PROG = { '182':'182 · PJJ', '107':'107 · Services de l\'État', '912':'912 · Cantine' };
const COLS = { objet:'Objet', lots:'Lots', reference:'Reference', titulaire:'Titulaire', fournisseur:'N_fournisseur',
  ej:'N_EJ', pa:'PA', duree:'Duree', debut:'Debut', fin:'Fin', referent:'Referent', rubrique:'Rubrique',
  prestations:'Prestations', commentaires:'Commentaires', infos:'Infos', postes:'Postes_json' };
const TEINTES = {'31':'#5b4b8a','32':'#a34a00','33':'#1d5fa8','34':'#4a5a6a','35':'#00727a','36':'#7a4a2a',
  '37':'#b02a5b','38':'#6b4fa0','39':'#56606e','40':'#2e6b30','41':'#8a3fa0','42':'#7a1f1f','43':'#0b6e6e',

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const uniq = a => [...new Set(a.filter(x => x !== '' && x != null))];
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
function toDate(v){
  if (v == null || v === '') return null;
  if (v instanceof Date) return isNaN(v) ? null : v;
  if (typeof v === 'number') return new Date(v * 1000);
  const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  const d = new Date(v); return isNaN(d) ? null : d;
}
const fmt = d => d ? d.toLocaleDateString('fr-FR') : '';
const periode = (a,b) => (a||b) ? `${fmt(a)||'?'} → ${fmt(b)||'?'}` : '';
const fmtDuree = j => j < 61 ? `${j} j` : (Math.round(j/30.4) < 24 ? `${Math.round(j/30.4)} mois` : `${(j/365).toFixed(1).replace('.',',')} ans`);
function statut(fin){
  if (!fin) return {k:'na', label:'Sans date de fin', cls:'b-na'};
  const j = Math.round((fin - today()) / 864e5);
  if (j < 0) return {k:'bad', label:`Expiré depuis ${fmtDuree(-j)}`, cls:'b-bad', j};
  if (j <= ALERTE_JOURS) return {k:'warn', label:`Fin dans ${fmtDuree(j)}`, cls:'b-warn', j};
  return {k:'ok', label:`Actif · ${fmtDuree(j)} restants`, cls:'b-ok', j};
}
function hl(text, terms){
  const src = String(text ?? '');
  if (!terms.length || !src) return esc(src);
  const n = norm(src), marks = [];
  terms.forEach(t => { let i = 0; while ((i = n.indexOf(t, i)) > -1){ marks.push([i, i + t.length]); i += t.length; } });
  if (!marks.length) return esc(src);
  marks.sort((a,b)=>a[0]-b[0]); const mg=[];
  marks.forEach(m => { const l = mg[mg.length-1]; if (l && m[0] <= l[1]) l[1] = Math.max(l[1], m[1]); else mg.push([...m]); });
  let res = '', p = 0; mg.forEach(([a,b]) => { res += esc(src.slice(p,a)) + '<mark>' + esc(src.slice(a,b)) + '</mark>'; p = b; });
  return res + esc(src.slice(p));
}
const plural = (n, s, p) => `${n} ${n > 1 ? (p || s + 's') : s}`;
const ordre = c => c === '—' ? 'zz' : c;
/* Codes GM / segment / domaine : Grist peut les avoir importés comme des dates (37.01.01 → 1937-01-01) ou des nombres (32.01 → 32,01) */
function normGM(v){
  if (v == null || v === '') return '';
  const s = String(v).trim(); let d = null;
  if (v instanceof Date) d = v;
  else if (typeof v === 'number' || /^-?\d{6,}$/.test(s)) d = new Date(Number(v) * 1000);
  if (d && !isNaN(d)) return [d.getUTCFullYear() % 100, d.getUTCMonth() + 1, d.getUTCDate()].map(x => String(x).padStart(2, '0')).join('.');
  const m = s.match(/^\d{2}(\d{2})-(\d{2})-(\d{2})/); if (m) return `${m[1]}.${m[2]}.${m[3]}`;
  return s;
}
const normDom = v => { if (v == null || v === '') return ''; const s = String(typeof v === 'number' ? Math.trunc(v) : v).trim(); return /^\d$/.test(s) ? '0' + s : s; };
const normSeg = v => { if (v == null || v === '') return ''; if (typeof v === 'number') return v.toFixed(2).padStart(5, '0'); return String(v).trim(); };

let EJS = [], POSTES_TABLE = null, lastFocus = null, current = null;

try { const s = JSON.parse(localStorage.getItem('marches-ui') || '{}'); Object.assign(state, {profil:s.profil||'', sous:s.sous||'', sort:s.sort||'arbo'}); } catch(e){}

/* Un enregistrement Grist (table Marches) = un EJ ; ses postes portent programme, GM, structure… */
function normaliseEJ(rec){
  const g = k => { const v = rec[COLS[k]]; return v == null ? '' : v; };
  let postes = [];
  const raw = g('postes');
  if (raw) { try { postes = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch(e){ postes = []; } }
  if (!postes.length && POSTES_TABLE) postes = POSTES_TABLE.filter(p => p.Marche === rec.id || (rec.ID_marche && String(p.Marche) === String(rec.ID_marche))).map(p => ({
    id:p.id, source:p.Source, ligne:p.Ligne_source, poste:p.Poste, programme:p.Programme, libelle:p.Libelle_poste, structure:p.Structure, lot:p.Lot, gm:p.GM,
    gm_libelle:p.Libelle_GM, segment:p.Segment, segment_libelle:p.Libelle_segment, domaine:p.Domaine_achat,
    domaine_libelle:p.Libelle_domaine, cf:p.Centre_financier, df:p.Domaine_fonctionnel, activite:p.Activite,
    axe:p.Axe, prestation:p.Prestation, duree:p.Duree, debut:p.Debut, fin:p.Fin, commentaire:p.Commentaire, info:p.Info }));
  postes.forEach(p => { let pm = String(p.programme ?? '').match(/(912|107|182)/);
    if (!pm) for (const x of [p.df, p.cf, p.activite]){ const m = String(x ?? '').match(/^\D*?0?(912|107|182)/); if (m){ pm = m; break; } }
    p.programme = pm ? pm[1] : ''; p.gm = normGM(p.gm); p.segment = normSeg(p.segment); p.domaine = normDom(p.domaine) || '—';
    if (p.domaine === '—') p.domaine_libelle = 'Non classé (GM à renseigner)'; });
  return { id:rec.id, objet:g('objet'), lots:g('lots'), reference:g('reference'), titulaire:g('titulaire'),
    fournisseur:String(g('fournisseur')), ej:String(g('ej')), pa:g('pa'), duree:g('duree'),
    debut:toDate(g('debut')), fin:toDate(g('fin')), referent:g('referent'), rubrique:g('rubrique'),
    prestations:g('prestations'), commentaires:g('commentaires'), infos:g('infos'), sources:rec.Sources || '', archive: !!rec.Archive, postes };
}

/* Carte = un marché attribué (objet + référence + lot + titulaire), regroupant ses EJ dans le périmètre choisi */
function buildCards(){
  const sc = scope(), map = new Map();
  EJS.forEach(e => {
    const vis = e.postes.filter(p => sc.includes(p.programme));
    if (!vis.length) return;
    const k = [e.objet, e.reference, e.lots, e.titulaire].join('|');
    if (!map.has(k)) map.set(k, { key:k, ejs:[] });
    map.get(k).ejs.push({ ...e, vis });
  });
  return [...map.values()].map(c => {
    const e0 = c.ejs[0], vis = c.ejs.flatMap(e => e.vis), all = c.ejs.flatMap(e => e.postes);
    const fins = c.ejs.map(e => e.fin).filter(Boolean), debs = c.ejs.map(e => e.debut).filter(Boolean);
    const progsAll = uniq(all.map(p => p.programme));
    const card = { key:c.key, ejs:c.ejs, objet:e0.objet, lots:e0.lots, reference:e0.reference, titulaire:e0.titulaire,
      pa:uniq(c.ejs.map(e=>e.pa)).join(' / '), duree:uniq(c.ejs.map(e=>e.duree)).join(' / '),
      referent:uniq(c.ejs.map(e=>e.referent)).join(' / '), rubrique:e0.rubrique,
      debut:debs.length ? new Date(Math.min(...debs)) : null, fin:fins.length ? new Date(Math.max(...fins)) : null,
      structures:uniq(vis.map(p => p.structure)), progs:uniq(vis.map(p => p.programme)).sort(),
      mutualise:progsAll.includes('182') && (progsAll.includes('107') || progsAll.includes('912')),
      horsPerimetre:all.length - vis.length,
      domaines:uniq(vis.map(p => p.domaine)).sort((a,b)=>ordre(a).localeCompare(ordre(b))),
      domLib:Object.fromEntries(vis.map(p => [p.domaine, p.domaine_libelle])),
      gms:uniq(vis.map(p => p.gm)), gmLib:Object.fromEntries(vis.map(p => [p.gm, p.gm_libelle])),
      vis };
    card.titre = card.lots || card.reference || card.objet;
    card.st = statut(card.fin);
    card.hay = norm([card.objet, card.lots, card.reference, card.titulaire, card.pa, card.referent, card.rubrique,
      ...c.ejs.flatMap(e => [e.ej, e.fournisseur, e.prestations, e.commentaires, e.infos]),
      ...vis.map(p => [p.structure, p.libelle, p.lot, p.gm, p.gm_libelle, p.segment_libelle, p.domaine_libelle, p.prestation, p.commentaire, p.info, p.cf, p.df, p.activite].join(' '))].join(' | '));
    return card;
  });
}

/* ===================== Filtres ===================== */
const terms = () => norm(state.q).split(/\s+/).filter(Boolean);
function filtered(ignore){
  const t = terms();
  return CARDS.filter(c =>
    (ignore === 'dom' || !state.doms.size || c.domaines.some(d => state.doms.has(d))) &&
    (ignore === 'st' || !state.statut || (state.statut === 'mut' ? c.mutualise : c.st.k === state.statut)) &&
    (!state.etab || c.structures.includes(state.etab)) &&
    t.every(x => c.hay.includes(x)));
}

function renderKpis(){

  base.forEach(m => { c[m.st.k]++; if (m.mutualise) mut++; });
  const items = [['','marchés',base.length,''],['ok','actifs',c.ok,'ok'],['warn','à renouveler (< 6 mois)',c.warn,'warn'],['bad','expirés',c.bad,'bad']];

}
let CHIPS_OUVERT = false;
function renderChips(){
  const base = filtered('dom'), lib = {};

function majChevron(){
  const bar = document.querySelector('.chipsbar'), chips = [...document.querySelectorAll('#chips .chip')], btn = $('#more');
  if (!bar || !chips.length || bar.hidden){ btn.hidden = true; return; }
  bar.classList.remove('ferme');
  const top0 = chips[0].offsetTop, caches = chips.filter(c => c.offsetTop > top0 + 4);
  const actifsCaches = caches.filter(c => c.getAttribute('aria-pressed') === 'true').length;
  if (!caches.length){ btn.hidden = true; return; }
  btn.hidden = false;
  if (!CHIPS_OUVERT) bar.classList.add('ferme');
  const chev = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
  btn.innerHTML = CHIPS_OUVERT ? `Réduire ${chev}` : `+ ${caches.length} domaine${caches.length > 1 ? 's' : ''}${actifsCaches ? ' (' + actifsCaches + ' actif' + (actifsCaches > 1 ? 's' : '') + ')' : ''} ${chev}`;

}
function fillEtabs(){

function sitesHtml(list, t, max=3){
  if (!list.length) return '';
  const shown = list.slice(0, max).map(s => `<span class="etab">${hl(s, t)}</span>`).join(' ');
  return `<span class="sites" title="${esc(list.join(' · '))}">${IC_PIN}${shown}${list.length > max ? ` <span class="etab">+${list.length - max} autres</span>` : ''}</span>`;
}
function card(c, t, dom){
  const kicker = [c.objet !== c.titre ? c.objet : '', c.lots && c.reference ? c.reference : ''].filter(Boolean).join(' · ');
  const gmsDom = dom ? uniq(c.vis.filter(p => p.domaine === dom).map(p => p.gm)) : c.gms;
  const autres = dom ? c.domaines.filter(d => d !== dom) : [];
  const nbEJ = c.ejs.length;
  const progBadge = state.profil === 'DISP' && !state.sous ? `<span class="badge b-prog">${c.progs.join(' + ')}</span>` : '';
  const row = (l, v, cls='') => v ? `<dt>${l}</dt><dd class="${cls}" title="${esc(v)}">${hl(v, t)}</dd>` : '';
  return `<button type="button" class="card" data-k="${esc(c.key)}" style="--c:${teinte(dom || c.domaines[0])}" aria-label="${esc(c.titre)}, ${esc(c.titulaire||'titulaire non renseigné')}, ${esc(c.st.label)}">
    ${kicker ? `<span class="kick">${hl(kicker, t)}</span>` : ''}
    <span class="t">${hl(c.titre, t)}</span>
    <span class="who">${IC_FIRM}${hl(c.titulaire || 'Titulaire non renseigné', t)}</span>
    ${sitesHtml(c.structures, t)}
    <dl>
      ${nbEJ === 1 ? row('N° EJ', c.ejs[0].ej, 'mono') : `<dt>EJ</dt><dd>${nbEJ} engagements juridiques</dd>`}
      ${row('GM', gmsDom.map(g => `${g} ${c.gmLib[g]||''}`).join(' · '))}
      ${row('Pouvoir adj.', c.pa)}
      ${row('Référent', c.referent)}
    </dl>
    <span class="foot">
      <span class="badge ${c.st.cls}">${c.st.label}</span>${progBadge}
      ${c.mutualise ? '<span class="badge b-mut">Mutualisé PJJ–DISP</span>' : ''}
      <span>${periode(c.debut, c.fin)}</span>
    </span>
    ${autres.length ? `<span class="note">Aussi classé en ${autres.map(d => esc(d)).join(', ')}</span>` : ''}
  </button>`;
}

        <button type="button" class="btn primary" style="height:auto;padding:14px 22px;flex-direction:column;align-items:flex-start" data-go="DISP"><b style="font-size:16px">Gestionnaire DISP</b><span>Programmes 107 et 912 · ${n('DISP')} EJ</span></button>

    return `<details class="dom" ${open || doms.length === 1 ? 'open' : ''}><summary>${IC_CHEV}

    </summary><div class="cards">${items.map(c => card(c, t, d)).join('')}</div></details>`;
  }).join('');
}

function cpBtn(value, label){
  if (value === '' || value == null) return '';
  return `<button type="button" class="cp" data-copy="${esc(value)}" data-label="${esc(label)}" aria-label="Copier ${esc(label)}" title="Copier ${esc(label)}">${IC_COPY}</button>`;
}
function field(label, value, cls=''){
  if (value === '' || value == null) return '';
  return `<div class="field"><dt>${esc(label)}</dt><dd class="${cls}">${esc(value)}</dd>${cpBtn(value, label)}</div>`;
}

async function copy(text, btn, label){
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch(e){ const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly','');
    ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch(_){} ta.remove(); }
  $('#live').textContent = ok ? `Copié : ${label}` : 'Copie impossible';
  if (ok && btn){ const ic = btn.querySelector('svg'); const old = ic.outerHTML; ic.outerHTML = IC_OK; btn.classList.add('done');
    setTimeout(() => { const s = btn.querySelector('svg'); if (s) s.outerHTML = old; btn.classList.remove('done'); }, 1300); }
}

/* Règles recalculées à chaque mise à jour de Grist : une correction enregistrée fait disparaître l'alerte. */
let NOMEN = null, IGNORES = new Set(), IGNORE_OK = false, PROG_COLONNE = true;
const PROGS_VALIDES = ['182','107','912'];
const REGLES = {
  EJ_VIDE:{ label:'N° EJ manquant', aide:'Saisir le numéro d\'engagement juridique (10 chiffres).' },
  EJ_FORMAT:{ label:'N° EJ mal formé', aide:'Un n° EJ compte 10 chiffres.' },
  EJ_DOUBLON:{ label:'Même n° EJ sur plusieurs lignes', aide:'Vérifier s\'il s\'agit de lots distincts ou d\'un doublon de saisie.' },
  TIT_VIDE:{ label:'Titulaire manquant ou « à venir »', aide:'Saisir le titulaire une fois le marché attribué.' },
  FOUR_FORMAT:{ label:'N° fournisseur mal formé', aide:'Un n° fournisseur Chorus compte 10 chiffres.' },
  FIN_VIDE:{ label:'Date de fin manquante', aide:'Saisir la date de fin du marché.' },
  FIN_AVANT:{ label:'Fin antérieure au début', aide:'Corriger la date de fin.' },
  GM_VIDE:{ label:'Poste sans GM', aide:'Saisir le groupe de marchandises (ex. 37.01.01).' },
  GM_INCONNU:{ label:'GM absent de la nomenclature', aide:'Choisir un GM de la nomenclature.' },
  PROG_VIDE:{ label:'Programme manquant', aide:'Indiquer le programme du poste.' }
};
const ctrlKey = c => `${c.code}:${c.table}:${c.rowId}`;
function controles(){
  const sc = scope(), out = [];
  const inScope = p => sc.includes(p.programme) || !PROGS_VALIDES.includes(p.programme);
  const parEJ = {};
  EJS.forEach(e => { if (e.ej) (parEJ[e.ej] = parEJ[e.ej] || []).push(e); });
  EJS.forEach(e => {
    const vis = e.postes.filter(inScope);
    if (!vis.length) return;
    const base = { ej:e, table:'Marches', rowId:e.id, src:e.sources };
    const add = (code, field, type, value, extra={}) => out.push({ ...base, code, field, type, value, ...extra });
    if (!e.ej) add('EJ_VIDE', 'N_EJ', 'text', '');
    else if (!/^\d{10}$/.test(e.ej)) add('EJ_FORMAT', 'N_EJ', 'text', e.ej);
    else if (parEJ[e.ej].length > 1) add('EJ_DOUBLON', null, null, e.ej, { detail:`${parEJ[e.ej].length} lignes : ` + parEJ[e.ej].map(x => x.lots || x.reference || x.objet).join(' | ') });
    if (!e.titulaire || /venir/i.test(e.titulaire)) add('TIT_VIDE', 'Titulaire', 'text', /venir/i.test(e.titulaire) ? '' : e.titulaire);
    if (e.fournisseur && !/^\d{10}$/.test(e.fournisseur)) add('FOUR_FORMAT', 'N_fournisseur', 'text', e.fournisseur);
    if (!e.fin) add('FIN_VIDE', 'Fin', 'date', '');
    else if (e.debut && e.fin < e.debut) add('FIN_AVANT', 'Fin', 'date', e.fin);
    vis.forEach(p => {
      if (p.id == null) return;
      const pb = { ej:e, table:'Postes', rowId:p.id, poste:p, src:p.source ? `${p.source}${p.ligne ? ':' + p.ligne : ''}` : e.sources };
      if (!p.gm) out.push({ ...pb, code:'GM_VIDE', field:'GM', type:'gm', value:'' });
      else if (!p.gm_libelle || (NOMEN && !NOMEN.has(p.gm))) out.push({ ...pb, code:'GM_INCONNU', field:'GM', type:'gm', value:p.gm });
      if (PROG_COLONNE && !PROGS_VALIDES.includes(p.programme)) out.push({ ...pb, code:'PROG_VIDE', field:'Programme', type:'prog', value:p.programme });
    });
  });
  const t = terms();
  return out.filter(c => !IGNORES.has(ctrlKey(c)) && (!t.length || t.every(x => norm([c.ej.objet, c.ej.lots, c.ej.titulaire, c.ej.ej, c.value, c.src, c.poste?.structure].join(' ')).includes(x))));
}
function srcHtml(src){
  if (!src) return '';
  return String(src).split(/\s*;\s*/).filter(Boolean).map(s => {
    const m = s.match(/^(.*):([\d-]+)$/);
    return m ? `<span class="src" title="Tableau d'origine">Onglet ${esc(m[1])} · ligne${m[2].includes('-')?'s':''} ${esc(m[2])}</span>` : `<span class="src">${esc(s)}</span>`;
  }).join('');
}
function editeur(c, i){
  const id = `fx-${i}`, lab = `<label class="sr" for="${id}">${esc(REGLES[c.code].label)} : nouvelle valeur</label>`;
  if (!c.field) return `<span class="note">À vérifier dans le tableau d'origine.</span>`;
  let input;
  if (c.type === 'date') input = `<input id="${id}" type="date" value="${c.value instanceof Date ? c.value.toISOString().slice(0,10) : ''}">`;
  else if (c.type === 'prog') input = `<select id="${id}"><option value="">Choisir…</option>${PROGS_VALIDES.map(x => `<option value="${x}">${esc(LIB_PROG[x])}</option>`).join('')}</select>`;
  else if (c.type === 'gm') input = `<input id="${id}" list="gmlist" value="${esc(c.value)}" placeholder="37.01.01" autocomplete="off">`;
  else input = `<input id="${id}" type="text" value="${esc(c.value)}" ${c.field.startsWith('N_') ? 'inputmode="numeric" placeholder="10 chiffres"' : ''}>`;
  return `${lab}${input}<button type="button" class="btn primary" data-fix="${i}">Enregistrer</button>`;
}
let CTRL_VIEW = [];
/* Réparation des codes GM convertis en dates à l'import */
let GMFIX = null;   // { Postes:{ids, cols}, Nomenclature_GM:{…}, n }
async function detecterGM(){
  const plan = { n:0 };
  const regles = { Postes:{ GM:normGM, Segment:normSeg, Domaine_achat:normDom }, Nomenclature_GM:{ GM:normGM, Segment:normSeg, Domaine:normDom } };
  for (const [t, cols] of Object.entries(regles)){
    let tab; try { tab = await grist.docApi.fetchTable(t); } catch(e){ continue; }
    const ids = [], vals = {}; Object.keys(cols).forEach(c => vals[c] = []);
    tab.id.forEach((id, i) => {
      let change = false; const row = {};
      Object.entries(cols).forEach(([c, f]) => { if (!(c in tab)) return; const raw = tab[c][i], v = f(raw); row[c] = v; if (raw !== '' && raw != null && String(raw) !== v) change = true; });
      if (change){ ids.push(id); Object.keys(row).forEach(c => vals[c].push(row[c])); }
    });
    Object.keys(vals).forEach(c => { if (!(c in tab)) delete vals[c]; });
    if (ids.length){ plan[t] = { ids, vals }; plan.n += ids.length; }
  }
  GMFIX = plan.n ? plan : null;
  if (GMFIX) diag(`Des codes GM ont été transformés en dates par Grist à l'import (${GMFIX.n} lignes). Ouvrez l'onglet Contrôles pour les réparer.`);
}
async function reparerGM(btn){
  if (!GMFIX) return; btn.disabled = true; btn.textContent = 'Réparation…';
  try {
    const A = ['Postes','Nomenclature_GM'].filter(t => GMFIX[t]).map(t => ['BulkUpdateRecord', t, GMFIX[t].ids, GMFIX[t].vals]);
    await grist.docApi.applyUserActions(A);
    GMFIX = null; $('#diag').hidden = true; DIAG.length = 0;
    try { const t = await grist.docApi.fetchTable('Postes'); POSTES_TABLE = t.id.map((id,i) => Object.fromEntries(Object.keys(t).map(k => [k, t[k][i]]))); } catch(e){}
    render(); $('#live').textContent = 'Codes GM réparés';
  } catch(e){ btn.disabled = false; btn.textContent = 'Réparer les codes GM'; alert('Réparation refusée : ' + (e.message || e)); }
}

  Object.keys(REGLES).filter(k => groupes[k]).map(k => `<section class="cgroup" aria-labelledby="cg-${k}"><h2 id="cg-${k}">${esc(REGLES[k].label)} <span class="badge b-bad">${groupes[k].length}</span><span class="note">${esc(REGLES[k].aide)}</span></h2>
    ${groupes[k].map(([c, i]) => `<div class="crow">
      <div class="what"><b>${esc(c.ej.lots || c.ej.reference || c.ej.objet || 'Sans objet')}</b>
        <span class="note">${esc(c.ej.objet !== (c.ej.lots || c.ej.reference || c.ej.objet) ? c.ej.objet + ' · ' : '')}${esc(c.ej.titulaire || 'Titulaire non renseigné')}${c.ej.ej ? ' · EJ ' + esc(c.ej.ej) : ''}${c.poste ? ` · poste ${esc(c.poste.poste)}${c.poste.structure ? ' (' + esc(c.poste.structure) + ')' : ''} · ${esc(c.poste.programme || 'programme ?')}` : ''}</span>
        ${c.detail ? `<span class="note">${esc(c.detail)}</span>` : ''}
        ${srcHtml(c.src)}</div>
      <div class="fix">${editeur(c, i)}${IGNORE_OK ? `<button type="button" class="btn ghost" data-ign="${i}">Ignorer</button>` : ''}<span class="msg" id="msg-${i}" role="status"></span></div>
    </div>`).join('')}</section>`).join('');
}
function versGrist(c, raw){
  if (c.type === 'date'){ if (!raw) return null; const [y,m,d] = raw.split('-').map(Number); return Date.UTC(y, m-1, d) / 1000; }
  return String(raw).trim();
}
async function corriger(i){
  const c = CTRL_VIEW[i]; if (!c) return;
  const el = document.getElementById(`fx-${i}`), msg = document.getElementById(`msg-${i}`), v = el.value.trim();
  const bad = (c.field === 'N_EJ' || c.field === 'N_fournisseur') && !/^\d{10}$/.test(v) ? 'Saisissez 10 chiffres.'
    : c.type === 'gm' && NOMEN && !NOMEN.has(v) ? 'Ce GM n\'est pas dans la nomenclature.'
    : !v ? 'Saisissez une valeur.' : '';
  if (bad){ msg.className = 'msg err'; msg.textContent = bad; el.setAttribute('aria-invalid','true'); el.focus(); return; }
  el.removeAttribute('aria-invalid');
  if (!INSIDE){ msg.className = 'msg err'; msg.textContent = 'Disponible uniquement dans Grist.'; return; }
  try {
    await grist.docApi.applyUserActions([['UpdateRecord', c.table, c.rowId, { [c.field]: versGrist(c, v) }]]);
    msg.className = 'msg ok'; msg.textContent = 'Enregistré'; $('#live').textContent = 'Correction enregistrée';
  } catch(e){
    msg.className = 'msg err';
    msg.textContent = /formula/i.test(String(e)) ? 'Cette colonne est calculée par une formule : corrigez la source.' : 'Enregistrement refusé (droits d\'écriture ?).';
  }
}
async function ignorer(i){
  const c = CTRL_VIEW[i]; if (!c || !INSIDE) return;
  try { await grist.docApi.applyUserActions([['AddRecord', 'Controles_ignores', null, { Cle: ctrlKey(c), Controle: REGLES[c.code].label, Date: Date.now()/1000 }]]);
    IGNORES.add(ctrlKey(c)); render(); $('#live').textContent = 'Contrôle ignoré'; }
  catch(e){ const msg = document.getElementById(`msg-${i}`); msg.className = 'msg err'; msg.textContent = 'Impossible d\'enregistrer (droits ?).'; }
}

  const go = e.target.closest('[data-go]');
  if (go){ state.profil = go.dataset.go; state.sous = ''; save(); refresh(); $(`#profil button[data-p="${state.profil}"]`)?.focus(); return; }
  const c = e.target.closest('.card'); if (c) openPanel(c.dataset.k, c); });
$('#veil').addEventListener('click', closePanel); $('#close').addEventListener('click', closePanel);
$('#copyAll').addEventListener('click', e => { if (current) copy(ficheTexte(current), e.currentTarget, 'la fiche complète'); });
$('#pb').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !current) return;
  if (b.dataset.copy != null) copy(b.dataset.copy, b, b.dataset.label);
  else if (b.dataset.copyRow){ const [i,j] = b.dataset.copyRow.split(':').map(Number); copy(tsv([posteCells(current.ejs[i].vis[j])]), b, 'la ligne du poste'); }
  else if (b.dataset.copyEj != null){ const e2 = current.ejs[+b.dataset.copyEj]; copy(tsv([['N° EJ', ...POSTE_HEAD], ...e2.vis.map(p => [e2.ej, ...posteCells(p)])]), b, 'les postes de l\'EJ'); }
});
document.addEventListener('keydown', e => {
  const open = $('#panel').classList.contains('on');
  if (e.key === 'Escape' && open){ closePanel(); return; }
  if (open && e.key === 'Tab'){
    const f = [...$('#panel').querySelectorAll('button,[href],input,select,[tabindex]:not([tabindex="-1"])')].filter(x => !x.disabled);
    if (!f.length) return; const first = f[0], last = f[f.length-1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
  if (!open && e.key === '/' && !['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)){ e.preventDefault(); $('#q').focus(); }
});
function load(records){
  RAW = records;
  EJS = records.map(normaliseEJ).filter(e => !e.archive);   // les marchés archivés (widget de saisie) sont exclus
  const tous = EJS.flatMap(e => e.postes);
  PROG_COLONNE = tous.some(p => p.programme);
  if (tous.length && !PROG_COLONNE) diag('Les postes n\'ont aucun programme : ce document a été créé avec l\'ancien fichier d\'import (PJJ seul, 86 EJ). Réimportez la dernière version de Marches_import_Grist.xlsx (384 EJ, colonne Postes.Programme).');
  refresh(); }

/* ===================== Logo et police depuis Grist ===================== */
const ids = v => Array.isArray(v) ? v.filter(x => typeof x === 'number') : (typeof v === 'number' ? [v] : []);
function graisse(nom){
  const n = norm(nom);
  const w = /thin|hairline/.test(n) ? 100 : /extra.?light|ultra.?light/.test(n) ? 200 : /light/.test(n) ? 300
          : /medium/.test(n) ? 500 : /semi.?bold|demi/.test(n) ? 600 : /extra.?bold|heavy|black/.test(n) ? 800
          : /bold/.test(n) ? 700 : 400;
  return { weight:String(w), style:/italic|oblique/.test(n) ? 'italic' : 'normal' };
}
/* Reconnaît le format d'après les premiers octets (Grist sert les pièces jointes sans type fiable) */
function sniff(buf){
  const b = new Uint8Array(buf.slice(0, 16)), t = new TextDecoder().decode(buf.slice(0, 300)).trim().toLowerCase();
  const sig = String.fromCharCode(...b.slice(0, 4));
  if (b[0] === 0x89 && sig.slice(1) === 'PNG') return { kind:'img', type:'image/png' };
  if (b[0] === 0xFF && b[1] === 0xD8) return { kind:'img', type:'image/jpeg' };
  if (sig === 'GIF8') return { kind:'img', type:'image/gif' };
  if (sig === 'RIFF' && String.fromCharCode(...b.slice(8, 12)) === 'WEBP') return { kind:'img', type:'image/webp' };
  if (t.startsWith('<svg') || (t.startsWith('<?xml') && t.includes('<svg')) || t.includes('<svg')) return { kind:'img', type:'image/svg+xml' };
  if (sig === 'wOF2') return { kind:'font', type:'font/woff2' };
  if (sig === 'wOFF') return { kind:'font', type:'font/woff' };
  if (sig === 'OTTO') return { kind:'font', type:'font/otf' };
  if (b[0] === 0 && b[1] === 1 && b[2] === 0 && b[3] === 0) return { kind:'font', type:'font/ttf' };
  if (sig === 'PK\x03\x04') return { kind:'zip' };
  return { kind:'?' };
}
const DIAG = [];
function diag(msg){ if (DIAG.includes(msg)) return; DIAG.push(msg); const d = $('#diag'); if (d){ d.hidden = false; d.textContent = DIAG.join(' · '); } console.warn('[widget marchés]', msg); }
async function chargerRessources(){
  let ctx;
  try { ctx = await grist.docApi.fetchTable(RESSOURCES.table); }
  catch(e){ diag(`Table « ${RESSOURCES.table} » introuvable ou accès insuffisant (régler le widget sur « Accès complet »)`); return; }
  if (!ctx.id || !ctx.id.length){ diag(`La table « ${RESSOURCES.table} » est vide`); return; }
  const col = k => (ctx[RESSOURCES[k]] || [])[0];
  if (!(RESSOURCES.logo in ctx)) diag(`Colonne « ${RESSOURCES.logo} » absente de ${RESSOURCES.table}`);
  const texte = col('mention'); if (texte) $('#mention').textContent = texte;
  const logoIds = ids(col('logo')), policeIds = ids(col('police'));
  if (RESSOURCES.logo in ctx && !logoIds.length) diag(`Aucune pièce jointe dans « ${RESSOURCES.logo} » (vérifier que la colonne est de type Pièces jointes)`);
  if (!logoIds.length && !policeIds.length) return;
  let noms = {};
  try { const att = await grist.docApi.fetchTable('_grist_Attachments'); att.id.forEach((id, i) => noms[id] = att.fileName?.[i] || ''); } catch(e){}
  let acces;
  try { acces = await grist.docApi.getAccessToken({ readOnly:true }); }
  catch(e){ diag('Jeton d\'accès refusé : régler le widget sur « Accès complet au document »'); return; }
  const lire = async id => {
    const r = await fetch(`${acces.baseUrl}/attachments/${id}/download?auth=${acces.token}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.arrayBuffer();
  };
  for (const id of logoIds.slice(0, 1)){
    try {
      const buf = await lire(id), f = sniff(buf);
      if (f.kind !== 'img'){ diag(`Le fichier logo « ${noms[id] || id} » n'est pas une image reconnue (png, jpg, svg)`); continue; }
      const img = $('#logo');
      img.onerror = () => { img.hidden = true; $('#sign').classList.remove('has-logo'); diag(`Logo « ${noms[id] || id} » illisible par le navigateur`); };
      img.src = URL.createObjectURL(new Blob([buf], { type: f.type })); img.hidden = false; $('#sign').classList.add('has-logo');
      LOGO_DATA = { type: f.type, b64: b64(buf) };
    } catch(e){ diag(`Logo non téléchargé (${e.message})`); }
  }
  for (const id of policeIds){
    try {
      const buf = await lire(id), f = sniff(buf);
      if (f.kind === 'zip'){ diag(`« ${noms[id] || id} » est un ZIP : déposer les fichiers de police décompressés`); continue; }
      if (f.kind !== 'font') continue;
      const face = new FontFace('Marianne', buf, { ...graisse(noms[id] || ''), display:'swap' });
      FONTS_DATA.push({ ...graisse(noms[id] || ''), b64: b64(buf) });
      await face.load(); document.fonts.add(face);
    } catch(e){ diag(`Police « ${noms[id] || id} » non chargée`); }
  }
}

/* ===================== Catalogue autonome ===================== */
/* Fabrique un fichier HTML unique contenant ce widget + toutes les données, le logo et la police : consultable hors Grist et hors réseau. */
const isoJ = v => { const d = toDate(v); return d ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}` : ''; };
async function construireAutonome(){
  const btn = $('#dl'); btn.disabled = true;
  try {
    let src = '';
    try { const r = await fetch(location.href.split('#')[0], { cache:'no-store' }); if (r.ok) src = await r.text(); } catch(e){}
    if (!/<\/html>\s*$/i.test(src.trim())) src = SOURCE0;
    src = src.replace(/<script src="https:\/\/docs\.getgrist\.com\/grist-plugin-api\.js"><\/script>\s*/i, '');
    const parId = new Map(EJS.map(e => [e.id, e]));
    const records = RAW.filter(r => parId.has(r.id)).map(r => {
      const o = {};
      Object.entries(r).forEach(([k, v]) => { if (typeof v === 'function') return; o[k] = v instanceof Date ? isoJ(v) : v; });
      o[COLS.postes] = JSON.stringify(parId.get(r.id).postes.map(p => ({ ...p, debut: isoJ(p.debut) || p.debut || '', fin: isoJ(p.fin) || p.fin || '' })));
      return o;
    });
    const embed = { genere: new Date().toISOString(), mention: $('#mention').textContent, logo: LOGO_DATA, fonts: FONTS_DATA, records };
    const json = JSON.stringify(embed).replace(/</g, '\\u003c');
    const marque = '<script>\n/* ===================== Configuration';
    const i = src.indexOf(marque);
    if (i < 0) throw new Error('structure de la page non reconnue');
    const html = src.slice(0, i) + `<script>window.__EMBED = ${json};<\/script>\n` + src.slice(i);
    const url = URL.createObjectURL(new Blob([html], { type:'text/html;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = NOM_AUTONOME; document.body.appendChild(a); a.click(); a.remove();
    const info = $('#info'); info.hidden = false;
    info.innerHTML = `Catalogue autonome généré : ${records.length} EJ, ${(html.length/1048576).toFixed(1).replace('.',',')} Mo. Si le téléchargement ne démarre pas, <a href="${url}" target="_blank" rel="noopener" download="${NOM_AUTONOME}">ouvrez-le ici</a> puis enregistrez la page (Ctrl+S).`;
  } catch(e){ diag('Catalogue autonome non généré : ' + (e.message || e)); }
  finally { btn.disabled = false; }
}
$('#dl').addEventListener('click', construireAutonome);

/* ===================== Démarrage ===================== */
$('#mention').textContent = MENTION;
$('#version').textContent = 'Version du widget : ' + VERSION;
const EMBED = window.__EMBED || null;
const INSIDE = !EMBED && window.self !== window.top && typeof grist !== 'undefined';
if (EMBED){
  /* Mode autonome : données figées, consultation seule */
  if (EMBED.mention) $('#mention').textContent = EMBED.mention;
  if (EMBED.logo){ const img = $('#logo'); img.src = `data:${EMBED.logo.type};base64,${EMBED.logo.b64}`; img.hidden = false; $('#sign').classList.add('has-logo'); }
  (EMBED.fonts || []).forEach(f => { try { const face = new FontFace('Marianne', deB64(f.b64), { weight:f.weight, style:f.style, display:'swap' }); face.load().then(x => document.fonts.add(x)).catch(() => {}); } catch(e){} });
  $('#tab-ctrl').hidden = true;
  const g = new Date(EMBED.genere);
  const info = $('#info'); info.hidden = false;
  info.textContent = `Catalogue autonome · données figées au ${g.toLocaleDateString('fr-FR')} à ${g.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' })} · consultation seule. Pour la version à jour, ouvrez le catalogue dans Grist.`;
  document.title = 'Catalogue des marchés (autonome)';
  load(EMBED.records || []);
} else if (INSIDE){
  $('#dl').hidden = false;
  grist.ready({ requiredAccess:'full' });
  chargerRessources(); chargerReferentiels();
  let recu = false;
  setTimeout(() => { if (!recu) diag('Aucune donnée reçue : vérifier que la vue personnalisée est branchée sur la table Marches et que l\'« Accès complet au document » a été accepté (panneau de droite › Personnalisé)'); }, 4000);
  grist.onRecords(async recs => {
    recu = true;
    const jsonVide = !recs.length || !(COLS.postes in recs[0]) || recs.every(r => !r[COLS.postes] || r[COLS.postes] === '[]');
    if (jsonVide){
      try { const t = await grist.docApi.fetchTable('Postes');
        POSTES_TABLE = t.id.map((id,i) => Object.fromEntries(Object.keys(t).map(k => [k, t[k][i]]))); }
      catch(e){ POSTES_TABLE = []; diag('Table Postes illisible : accorder l\'« Accès complet au document » au widget'); }
    }
    load(recs);
    if (recs.length && EJS.every(e => !e.postes.length)) diag(`${recs.length} EJ reçus mais aucun poste rattaché : convertir Postes.Marche en Référence vers Marches (colonne affichée ID_marche), puis vérifier la formule Postes_json`);
    else if (recs.length && !(COLS.postes in recs[0])) console.info('[widget marchés] Postes_json absente : lecture directe de la table Postes.');
  });
} else {
  $('#ui').hidden = true;
  $('#list').innerHTML = `<div class="hors-grist"><strong>Ce widget s'utilise dans Grist.</strong>Ajoutez une vue « Personnalisée » sur la table Marches et collez l'adresse de cette page.</div>`;
}
</script>
